name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm exec eslint .

      - name: Tests
        run: pnpm test
        env:
          # Public Google OAuth web client ID. It is not a secret: it is built into the app.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 1037617043812-hgn6rta4tmh1b7aqu71lerfkeojgnaig.apps.googleusercontent.com
